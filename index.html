<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyfta Abu Khalid - Smart Edition 🦾</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --accent: #e63946; --blue-assist: #3498db; --bg: #000000; --card: #1c1c1e; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 80px; }
        
        .card { background: var(--card); border-radius: 15px; padding: 15px; margin: 15px; cursor: pointer; border: 1px solid #2c2c2e; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        
        /* Modal Style (نافذة التفاصيل) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .modal-content { background: var(--card); border-radius: 20px; padding: 20px; max-width: 500px; margin: auto; }
        .close-btn { color: var(--accent); float: left; font-size: 28px; font-weight: bold; cursor: pointer; }

        /* Muscle Legend (دليل العضلات) */
        .muscle-info { margin-top: 15px; padding: 10px; border-radius: 10px; background: #2c2c2e; }
        .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-left: 5px; }
        
        .alternative-box { display: flex; gap: 10px; margin-top: 15px; overflow-x: auto; padding-bottom: 10px; }
        .alt-item { min-width: 100px; background: #2c2c2e; padding: 10px; border-radius: 10px; text-align: center; font-size: 11px; }
    </style>
</head>
<body>

<div style="padding: 20px; text-align: center;">
    <h2>تمارين اليوم 🏋️‍♂️</h2>
    <p style="color: #888;">إضغط على التمرين لمعرفة التفاصيل والبدائل</p>
</div>

<div class="card" onclick="openModal()">
    <div class="flex-between">
        <div>
            <h4 style="margin:0">Bench Press</h4>
            <p style="margin:5px 0 0; font-size:12px; color:#888;">الصدر المستوي - 3 جولات</p>
        </div>
        <i class="fas fa-info-circle" style="color: var(--accent); font-size: 20px;"></i>
    </div>
</div>

<div id="exerciseModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h3 style="text-align: center;">Bench Press (مستوي)</h3>
        
        <div style="width: 100%; height: 200px; background: #333; border-radius: 15px; display: flex; align-items: center; justify-content: center;">
            <i class="fas fa-dumbbell fa-4x" style="color: #555;"></i>
            <p style="position: absolute; font-size: 12px;">[صورة توضيحية للحركة]</p>
        </div>

        <div class="muscle-info">
            <h4 style="margin: 0 0 10px 0;">العضلات المستهدفة:</h4>
            <p style="font-size: 14px;"><span class="dot" style="background: var(--accent);"></span> رئيسية: عضلة الصدر الكبرى</p>
            <p style="font-size: 14px;"><span class="dot" style="background: var(--blue-assist);"></span> ثانوية: الترايسبس، الأكتاف الأمامية</p>
        </div>

        <h4 style="margin: 20px 0 10px 0;">تمارين بديلة:</h4>
        <div class="alternative-box">
            <div class="alt-item"><i class="fas fa-person-breastfeeding"></i><br>Push-up</div>
            <div class="alt-item"><i class="fas fa-grip-lines"></i><br>Dumbbell Press</div>
            <div class="alt-item"><i class="fas fa-vector-square"></i><br>Chest Press Machine</div>
        </div>
        
        <button onclick="closeModal()" style="width: 100%; padding: 15px; background: var(--accent); border: none; color: white; border-radius: 12px; margin-top: 20px; font-weight: bold;">فهمت، لنبدأ! 🚀</button>
    </div>
</div>

<script>
    function openModal() { document.getElementById("exerciseModal").style.display = "block"; }
    function closeModal() { document.getElementById("exerciseModal").style.display = "none"; }
</script>

</body>
</html>
