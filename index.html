  const EX_ANIMS={machine_chest_press:[()=>bench('ضغط صدر جهاز',false,false),()=>bench('ضغط صدر جهاز',false,true),()=>bench('ضغط صدر جهاز',false,false)],incline_press:[()=>bench('ضغط مائل',true,false),()=>bench('ضغط مائل',true,true),()=>bench('ضغط مائل',true,false)],lat_pulldown:[()=>pulldown('سحب علوي',false),()=>pulldown('سحب علوي',true),()=>pulldown('سحب علوي',false)],seated_row:[()=>row('سحب أرضي جهاز',false),()=>row('سحب أرضي جهاز',true),()=>row('سحب أرضي جهاز',false)],reverse_pec_deck:[()=>reversePec('كتف خلفي جهاز',false),()=>reversePec('كتف خلفي جهاز',true),()=>reversePec('كتف خلفي جهاز',false)],cable_lateral_raise:[()=>latRaise('كتف جانبي كيبل',false),()=>latRaise('كتف جانبي كيبل',true),()=>latRaise('كتف جانبي كيبل',false)],leg_press:[()=>legPressAnim('دفع الأرجل',false),()=>legPressAnim('دفع الأرجل',true),()=>legPressAnim('دفع الأرجل',false)],leg_extension:[()=>legExtensionAnim('تمديد الأرجل',false),()=>legExtensionAnim('تمديد الأرجل',true),()=>legExtensionAnim('تمديد الأرجل',false)],leg_curl:[()=>legCurlAnim('خلف الفخذ',false),()=>legCurlAnim('خلف الفخذ',true),()=>legCurlAnim('خلف الفخذ',false)],goblet_squat:[()=>goblet('سكوات دمبل خفيف',false),()=>goblet('سكوات دمبل خفيف',true),()=>goblet('سكوات دمبل خفيف',false)]};

  function mountAnimation(target,key){if(!target||!EX_ANIMS[key]) return null; let i=0; target.innerHTML=EX_ANIMS[key][0](); const timer=setInterval(()=>{i=(i+1)%EX_ANIMS[key].length; target.innerHTML=EX_ANIMS[key][i]();},650); return ()=>clearInterval(timer)}
  function yt(url){try{const u=new URL(url); if(u.hostname.includes('youtube.com')){const v=u.searchParams.get('v'); if(v) return `https://www.youtube-nocookie.com/embed/${v}`;} if(u.hostname.includes('youtu.be')) return `https://www.youtube-nocookie.com/embed/${u.pathname.replace('/','').trim()}`;}catch(_){} return ''}
  function gMeals(ms){const g={فطور:[],غداء:[],عشاء:[],سناك:[]}; ms.forEach(m=>{(g[m.category]||(g[m.category]=[])).push(m)}); return g}
  function keyDay(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
  function dayName(){return ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][new Date().getDay()]}
  function todayWorkout(){const m={'الأحد':'upper-a','الاثنين':'lower-a','الثلاثاء':null,'الأربعاء':'upper-b','الخميس':'lower-b','الجمعة':null,'السبت':null}; return TRAINING_DAYS.find(d=>d.id===m[dayName()])||null}
  async function seedMealsIfEmpty(){const r=collection(db,'meals');const s=await getDocs(r); if(!s.empty) return; await Promise.all(defaultMeals.map(m=>setDoc(doc(db,'meals',m.id),{...m,createdAt:serverTimestamp()})))}
  async function fetchMeals(){const s=await getDocs(query(collection(db,'meals'),orderBy('category'))); return s.docs.map(d=>({id:d.id,...d.data()}))}
  async function ensureTodayIntake(userId,todayKey){const ref=doc(db,'userDailyIntake',`${userId}_${todayKey}`); const s=await getDoc(ref); if(!s.exists()) await setDoc(ref,{userId,date:todayKey,calories:0,protein:0,carbs:0,fat:0,meals:[],targets:DAILY_TARGETS,createdAt:serverTimestamp(),updatedAt:serverTimestamp()}); const r=await getDoc(ref); return {id:r.id,...r.data()}}
  async function getTodayIntake(userId,todayKey){const ref=doc(db,'userDailyIntake',`${userId}_${todayKey}`); const s=await getDoc(ref); return s.exists()?{id:s.id,...s.data()}:null}
  async function addMealToDay({userId,todayKey,meal}){const ref=doc(db,'userDailyIntake',`${userId}_${todayKey}`); const s=await getDoc(ref); if(!s.exists()) await ensureTodayIntake(userId,todayKey); const l=await getDoc(ref); const data=l.data()||{}; const meals=Array.isArray(data.meals)?data.meals:[]; const entry={mealId:meal.id,name:meal.name,category:meal.category,calories:meal.calories,protein:meal.protein,carbs:meal.carbs,fat:meal.fat,addedAt:new Date().toISOString()}; await updateDoc(ref,{calories:increment(Number(meal.calories)||0),protein:increment(Number(meal.protein)||0),carbs:increment(Number(meal.carbs)||0),fat:increment(Number(meal.fat)||0),meals:[...meals,entry],updatedAt:serverTimestamp()}); return getTodayIntake(userId,todayKey)}
  function tStore(){return `captain_yasser_training_${keyDay()}`}
  const state={tab:'dashboard',meals:[],intake:null,modalExercise:null,todayWorkout:null,trainingLog:{},weeklySummary:{completedSessions:0,cardioMinutes:0,painAlerts:0},smartCoach:{message:'ابدأ اليوم بهدوء وركّز على الأداء النظيف.',status:'ready'}}; const appEl=document.getElementById('app'); let stopAnim=null;
  function saveLog(){localStorage.setItem(tStore(),JSON.stringify({trainingLog:state.trainingLog,weeklySummary:state.weeklySummary,smartCoach:state.smartCoach}))}
  function loadLog(){const raw=localStorage.getItem(tStore()); if(!raw) return; try{const p=JSON.parse(raw); state.trainingLog=p.trainingLog||{}; state.weeklySummary=p.weeklySummary||state.weeklySummary; state.smartCoach=p.smartCoach||state.smartCoach}catch(_){}}
  function refreshSummary(){const e=Object.values(state.trainingLog||{}); state.weeklySummary.completedSessions=e.filter(x=>x.completed).length; state.weeklySummary.painAlerts=e.filter(x=>Number(x.pain||0)>=TRAINING_TARGETS.painThreshold).length}
  function evalCoach(){const e=Object.values(state.trainingLog||{}); const done=e.filter(x=>x.completed).length; const avg=e.length?e.reduce((s,x)=>s+Number(x.pain||0),0)/e.length:0; const c=state.weeklySummary.cardioMinutes||0; if(avg>=TRAINING_TARGETS.painThreshold){state.smartCoach={status:'warning',message:'مستوى الألم مرتفع اليوم. خفف الشدة وركز على التحكم.'};return} if(done>=3&&c>=15){state.smartCoach={status:'great',message:'أداء ممتاز. إذا كانت آخر مجموعة مريحة، زد الوزن زيادة بسيطة جدًا في الحصة القادمة.'};return} if(done===0){state.smartCoach={status:'ready',message:'ابدأ اليوم بأول تمرين فقط ثم قيّم طاقتك. الأهم الآن الاستمرارية لا المثالية.'};return} state.smartCoach={status:'good',message:'أنت ماشي بشكل جيد. كمّل بهدوء، وخلك مركز على التكنيك أكثر من الوزن.'}}
  function suggestion(){if(!state.intake||!state.meals.length) return null; const p=Math.max(0,DAILY_TARGETS.protein-(state.intake.protein||0)), c=Math.max(0,DAILY_TARGETS.carbs-(state.intake.carbs||0)), f=Math.max(0,DAILY_TARGETS.fat-(state.intake.fat||0)); if(p>=c&&p>=f) return [...state.meals].filter(m=>m.protein>=20).sort((a,b)=>b.protein-a.protein)[0]; if(c>=p&&c>=f) return [...state.meals].filter(m=>m.carbs>=20).sort((a,b)=>b.carbs-a.carbs)[0]; return [...state.meals].filter(m=>m.fat>=10).sort((a,b)=>b.fat-a.fat)[0]}
  function setTab(tab){state.tab=tab; render()}
  function openExercise(ex){state.modalExercise=ex; render()}
  function closeModal(){state.modalExercise=null; if(stopAnim){stopAnim(); stopAnim=null} render()}
  function toggleDone(id){const c=state.trainingLog[id]||{completed:false,weight:'',repsDone:'',pain:0,notes:''}; state.trainingLog[id]={...c,completed:!c.completed}; refreshSummary(); evalCoach(); saveLog(); render()}
  function updateField(id,field,value){const c=state.trainingLog[id]||{completed:false,weight:'',repsDone:'',pain:0,notes:''}; state.trainingLog[id]={...c,[field]:value}; refreshSummary(); evalCoach(); saveLog()}
  function updateCardio(value){state.weeklySummary.cardioMinutes=Number(value||0); evalCoach(); saveLog(); render()}
  async function addMeal(id){const meal=state.meals.find(m=>m.id===id); if(!meal) return; state.intake=await addMealToDay({userId:DEFAULT_USER_ID,todayKey:keyDay(),meal}); render()}
  function coachBadge(){const m={ready:['#ecfeff','#0f766e','جاهز'],good:['#eff6ff','#1d4ed8','جيد'],great:['#ecfccb','#3f6212','ممتاز'],warning:['#fef2f2','#b91c1c','تنبيه']}; const s=m[state.smartCoach.status]||m.ready; return `<div style="background:${s[0]};color:${s[1]};padding:8px 12px;border-radius:999px;font-size:12px;font-weight:800;display:inline-block">${s[2]}</div>`}
  function tabs(){return `<div class="tabs"><button class="tab-btn ${state.tab==='dashboard'?'active':''}" onclick="window.__appSetTab('dashboard')">الرئيسية</button><button class="tab-btn ${state.tab==='training'?'active':''}" onclick="window.__appSetTab('training')">النظام التدريبي</button><button class="tab-btn ${state.tab==='meals'?'active':''}" onclick="window.__appSetTab('meals')">الوجبات والمتابعة</button></div>`}
  function hero(){return `<div class="card hero"><div class="hero-badge">نسخة مدمجة مع الأنيميشن</div><h1>كابتن ياسر<span>Upper / Lower Split</span></h1><p>كل التعديلات السابقة موجودة، ومعها أنيميشن ذكي أصلي داخل صفحة التمرين جنب الفيديو.</p><div class="grid grid-4"><div class="card metric"><div class="muted">أيام الحديد</div><div class="v">4</div></div><div class="card metric"><div class="muted">الكارديو</div><div class="v">15-20</div></div><div class="card metric"><div class="muted">التهيئة</div><div class="v">2-4</div></div><div class="card metric"><div class="muted">الأنيميشن</div><div class="v">ذكي</div></div></div></div>`}
  function dashboard(){const total=TRAINING_DAYS.reduce((s,d)=>s+d.exercises.length,0); const tw=state.todayWorkout; return `${hero()}<div class="card section"><div class="section-head"><div><h2 class="title">المدرب الذكي</h2><p class="sub">توصية اليوم بناءً على تقدمك الفعلي</p></div>${coachBadge()}</div><div class="item" style="background:#fff7ed;color:#7c2d12">${state.smartCoach.message}</div></div><div class="grid grid-2"><div class="card section"><h2 class="title">تمرين اليوم التلقائي</h2><p class="sub">يظهر لك تلقائيًا حسب اليوم</p>${tw?`<div class="item"><strong>${tw.name}</strong><br><span class="muted">${tw.focus}</span></div><button class="btn full" onclick="window.__appSetTab('training')">افتح تمرين اليوم</button>`:`<div class="item">اليوم مخصص للراحة أو المشي الخفيف.</div>`}</div><div class="card section"><h2 class="title">ملخصك اليومي</h2><p class="sub">متابعة ذكية وسريعة</p><div class="list"><div class="item">التمارين المنجزة: ${state.weeklySummary.completedSessions}</div><div class="item">دقائق الكارديو: ${state.weeklySummary.cardioMinutes}</div><div class="item">تنبيهات الألم: ${state.weeklySummary.painAlerts}</div></div></div></div><div class="grid grid-2"><div class="card section"><h2 class="title">توزيع الأسبوع</h2><p class="sub">الخطة الحالية</p><div class="list">${TRAINING_OVERVIEW.weeklyStructure.map(i=>`<div class="item">${i}</div>`).join('')}</div></div><div class="card section"><h2 class="title">ملاحظات البداية</h2><p class="sub">أول أسابيع الرجوع</p><div class="list"><div class="item">المدة: ${TRAINING_OVERVIEW.returnPhase.durationWeeks}</div><div class="item">زمن الجلسة: ${TRAINING_OVERVIEW.returnPhase.workoutDuration}</div><div class="item">الشدة: ${TRAINING_OVERVIEW.returnPhase.intensity}</div></div></div></div><div class="grid grid-4"><div class="card metric"><div class="muted">عدد الأيام التدريبية</div><div class="v">${TRAINING_DAYS.length}</div></div><div class="card metric"><div class="muted">عدد التمارين</div><div class="v">${total}</div></div><div class="card metric"><div class="muted">هدف السعرات</div><div class="v">${DAILY_TARGETS.calories}</div></div><div class="card metric"><div class="muted">هدف البروتين</div><div class="v">${DAILY_TARGETS.protein} جم</div></div></div>`}
  function trainingControls(ex){const l=state.trainingLog[ex.id]||{completed:false,weight:'',repsDone:'',pain:0,notes:''}; return `<div class="inputs"><input class="field" value="${l.weight||''}" oninput="window.__updateExerciseField('${ex.id}','weight',this.value)" placeholder="الوزن"/><input class="field" value="${l.repsDone||''}" oninput="window.__updateExerciseField('${ex.id}','repsDone',this.value)" placeholder="العدات الفعلية"/><input class="field" value="${l.pain||''}" oninput="window.__updateExerciseField('${ex.id}','pain',this.value)" placeholder="مستوى الألم 0-10"/></div><textarea class="textarea" oninput="window.__updateExerciseField('${ex.id}','notes',this.value)" placeholder="ملاحظات سريعة">${l.notes||''}</textarea><button class="btn ${l.completed?'done':''}" style="margin-top:10px" onclick="window.__toggleExerciseDone('${ex.id}')">${l.completed?'تم الإنجاز ✓':'تسجيل الإنجاز'}</button>`}
  function training(){const tw=state.todayWorkout; return `<div class="card section"><h2 class="title">النظام التدريبي</h2><p class="sub">كل تمرين فيه فيديو + أنيميشن + تسجيل وزن وعدات وألم.</p>${tw?`<div class="item" style="background:#ecfeff;color:#155e75"><strong>تمرين اليوم:</strong> ${tw.name}</div>`:''}<div class="card section" style="margin-top:16px;background:#f8fafc"><div class="section-head"><div><h2 class="title" style="font-size:22px">لوحة المتابعة الذكية</h2><p class="sub">سجل الكارديو ودع المدرب الذكي يعطيك توصية فورية</p></div></div><div class="grid grid-4"><div class="item">التمارين المنجزة: ${state.weeklySummary.completedSessions}</div><div class="item">تنبيهات الألم: ${state.weeklySummary.painAlerts}</div><div class="item">دقائق الكارديو<input class="field" value="${state.weeklySummary.cardioMinutes||''}" oninput="window.__updateCardioMinutes(this.value)" placeholder="مثلاً 15" style="margin-top:8px"/></div></div></div></div>${TRAINING_DAYS.map(day=>`<div class="card day"><div class="day-head"><div><h3 class="day-name">${day.name}</h3><div class="day-focus">${day.focus}</div></div><div class="pill">${day.cardio}</div></div><div class="day-notes">${day.notes}</div><div class="ex-list">${day.exercises.map((ex,i)=>{const l=state.trainingLog[ex.id]||{}; return `<div class="ex-wrap"><div class="ex-row"><button class="watch" onclick="window.__openExercise('${ex.id}')">شاهد</button><div class="ex-content"><div class="ex-title">${i+1}. ${ex.arabicName} <span>(${ex.name})</span></div><div class="chips"><div class="chip">${ex.duration}</div><div class="chip">${ex.level}</div><div class="chip">${ex.sets} مجموعات</div><div class="chip">${ex.reps}</div>${l.completed?'<div class="chip" style="background:#dcfce7;color:#166534">منجز</div>':''}</div>${trainingControls(ex)}</div></div></div>`}).join('')}</div></div>`).join('')}`}
  function progress(label,val,target,unit){return `<div class="card section"><div style="display:flex;justify-content:space-between;gap:10px"><div class="muted">${label}</div><div style="font-weight:700">${val} / ${target} ${unit}</div></div><div class="progress"><div class="fill" style="width:${Math.min(100,Math.round((val/target)*100))}%"></div></div></div>`}
  function meals(){const intake=state.intake||{calories:0,protein:0,carbs:0,fat:0,meals:[]}; const sug=suggestion(); const groups=gMeals(state.meals); return `<div class="card section"><h2 class="title">الوجبات والمتابعة</h2><p class="sub">واجهة فاتحة ومريحة للعين، مع إضافة الوجبات مباشرة وتحديث الماكروز في Firestore.</p></div><div class="grid grid-4">${progress('السعرات',intake.calories||0,DAILY_TARGETS.calories,'سعرة')}${progress('البروتين',intake.protein||0,DAILY_TARGETS.protein,'جم')}${progress('الكربوهيدرات',intake.carbs||0,DAILY_TARGETS.carbs,'جم')}${progress('الدهون',intake.fat||0,DAILY_TARGETS.fat,'جم')}</div>${sug?`<div class="card section"><div class="section-head"><div><h2 class="title">اقتراح ذكي</h2><p class="sub">حسب النقص الحالي في يومك</p></div></div><div class="suggestion-box"><div><h3 style="margin:0;font-size:28px">${sug.name}</h3><p class="muted">هذه الوجبة مناسبة غالبًا لتعويض النقص الحالي.</p><div class="chips" style="justify-content:flex-start"><div class="chip">${sug.calories} سعرة</div><div class="chip">بروتين ${sug.protein}</div><div class="chip">كارب ${sug.carbs}</div><div class="chip">دهون ${sug.fat}</div></div></div><div class="suggestion-side">ذكي</div></div></div>`:''}${Object.entries(groups).map(([cat,items])=>`<div class="card section"><div class="section-head"><div><h2 class="title">${cat}</h2><p class="sub">وجبات جاهزة</p></div><div class="badge">${items.length} وجبة</div></div><div class="meals">${items.map(meal=>`<div class="card section"><div class="meal-top"><div><h3>${meal.name}</h3><div class="muted">${meal.category}</div></div><div class="badge">${meal.calories} سعرة</div></div><div class="meta"><div class="box">بروتين: ${meal.protein}</div><div class="box">كارب: ${meal.carbs}</div><div class="box">دهون: ${meal.fat}</div><div class="box">${meal.category}</div></div><button class="btn full" onclick="window.__addMeal('${meal.id}')">إضافة لليوم</button></div>`).join('')}</div></div>`).join('')}<div class="card section"><div class="section-head"><div><h2 class="title">الوجبات المضافة اليوم</h2><p class="sub">سجل اليوم الحالي</p></div></div>${!intake.meals||!intake.meals.length?`<p class="muted">لم يتم إضافة أي وجبة اليوم بعد.</p>`:`<div class="list">${intake.meals.map(m=>`<div class="card section"><div class="log-top"><div><h4>${m.name}</h4><div class="muted">${m.category}</div></div><div class="muted">${m.calories} سعرة</div></div><div class="meta"><div class="box">بروتين ${m.protein}</div><div class="box">كارب ${m.carbs}</div><div class="box">دهون ${m.fat}</div><div class="box">تمت الإضافة</div></div></div>`).join('')}</div>`}</div>`}
  function modal(){if(!state.modalExercise) return ''; const embed=yt(state.modalExercise.link); return `<div class="modal" onclick="window.__closeModal(event)"><div class="modal-card" onclick="event.stopPropagation()"><div class="modal-head"><div><div style="font-size:22px;font-weight:800">${state.modalExercise.arabicName}</div><div class="muted">${state.modalExercise.name}</div></div><button class="close" onclick="window.__hideModal()">إغلاق</button></div><div class="modal-body"><div class="player-grid"><div class="anim-box"><div style="font-size:18px;font-weight:800;margin-bottom:10px">الأنيميشن الذكي</div><div id="anim-stage" class="anim-stage"></div><div class="small">تمثيل بصري أصلي وخفيف للتمرين داخل التطبيق.</div></div><div class="video-box"><div style="font-size:18px;font-weight:800;margin-bottom:10px">الفيديو التعليمي</div>${embed?`<div style="position:relative;padding-top:56.25%;border-radius:18px;overflow:hidden;background:#e2e8f0"><iframe src="${embed}" title="${state.modalExercise.arabicName}" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`:`<p class="muted">تعذر تضمين الفيديو.</p>`}<div class="chips" style="justify-content:flex-start;margin-top:12px"><div class="chip">${state.modalExercise.duration}</div><div class="chip">${state.modalExercise.level}</div><div class="chip">${state.modalExercise.sets} مجموعات</div><div class="chip">${state.modalExercise.reps}</div></div></div></div></div></div></div>`}
  function render(){let content=''; if(state.tab==='dashboard') content=dashboard(); if(state.tab==='training') content=training(); if(state.tab==='meals') content=meals(); appEl.innerHTML=`<div class="app">${tabs()}${content}${modal()}</div>`; if(state.modalExercise){const stage=document.getElementById('anim-stage'); if(stage&&state.modalExercise.animationKey){if(stopAnim) stopAnim(); stopAnim=mountAnimation(stage,state.modalExercise.animationKey)}}}
  window.__appSetTab=setTab; window.__toggleExerciseDone=toggleDone; window.__updateExerciseField=updateField; window.__updateCardioMinutes=updateCardio; window.__addMeal=addMeal; window.__hideModal=closeModal; window.__closeModal=(e)=>{if(e.target.classList.contains('modal')) closeModal()}; window.__openExercise=(id)=>{const ex=TRAINING_DAYS.flatMap(d=>d.exercises).find(x=>x.id===id); if(ex) openExercise(ex)};
  async function init(){state.todayWorkout=todayWorkout(); loadLog(); render(); await seedMealsIfEmpty(); state.meals=await fetchMeals(); state.intake=await ensureTodayIntake(DEFAULT_USER_ID,keyDay()); refreshSummary(); evalCoach(); render()}
  init().catch(err=>{console.error(err); appEl.innerHTML=`<div class="app"><div class="card section"><h2 class="title">صار خطأ في التشغيل</h2><p class="sub">غالبًا Firestore لم يُفعّل أو يوجد خطأ في بيانات Firebase.</p></div></div>`})
</script>
