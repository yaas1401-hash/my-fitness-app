<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>كابتن ياسر</title>
  <style>
    :root {
      --bg: #eef1f4;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #0f766e;
      --soft: #ccfbf1;
      --line: #e2e8f0;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      --radius: 24px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .app { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .tabs { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .tab-btn {
      border: 0; background: #fff; color: var(--muted); padding: 14px 18px; border-radius: 18px;
      font-weight: 700; cursor: pointer; box-shadow: var(--shadow);
    }
    .tab-btn.active { background: var(--primary); color: #fff; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .hero, .section, .metric, .exercise-card, .meal-card { padding: 18px; }
    .hero { padding: 28px; margin-bottom: 18px; }
    .hero-badge {
      display: inline-block; background: var(--soft); color: var(--primary); padding: 8px 12px;
      border-radius: 999px; font-size: 12px; font-weight: 700; margin-bottom: 12px;
    }
    h1 { margin: 0; font-size: 38px; }
    h1 span { display: block; color: var(--primary); }
    .muted { color: var(--muted); line-height: 1.9; }
    .grid { display: grid; gap: 16px; }
    .grid-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .grid-4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    .metric-value { font-size: 28px; font-weight: 800; margin-top: 8px; }
    .title { font-size: 26px; font-weight: 800; margin: 0 0 8px; }
    .subtitle { color: var(--muted); margin: 0 0 14px; }
    .list { display: grid; gap: 10px; }
    .list-item { background: #f8fafc; border-radius: 18px; padding: 14px; color: #475569; }
    .day-card { padding: 20px; margin-bottom: 18px; }
    .day-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .day-name { margin: 0; font-size: 28px; font-weight: 800; }
    .day-focus { color: var(--primary); font-weight: 700; margin-top: 6px; }
    .pill { background: var(--soft); color: var(--primary); padding: 12px 16px; border-radius: 18px; font-weight: 700; }
    .day-notes { margin: 16px 0 0; border-bottom: 4px solid #14b8a6; padding-bottom: 12px; color: var(--muted); }
    .exercise-list { display: grid; gap: 12px; margin-top: 18px; }
    .exercise-card { background: #f8fafc; border-radius: 22px; }
    .exercise-row {
      display: flex; gap: 12px; align-items: flex-start; background: #fff; border-radius: 18px;
      border-right: 6px solid #14b8a6; padding: 14px;
    }
    .watch-btn {
      min-width: 92px; border: 0; border-radius: 16px; background: var(--primary); color: white;
      padding: 14px 16px; font-weight: 800; cursor: pointer;
    }
    .exercise-content { flex: 1; }
    .exercise-title { font-size: 18px; font-weight: 800; }
    .exercise-title span { color: #475569; font-weight: 500; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .chip { background: #f1f5f9; color: #475569; border-radius: 999px; padding: 7px 12px; font-size: 12px; }
    .done-chip { background: #dcfce7; color: #166534; }
    .inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 12px; }
    .field, .textarea {
      width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 14px; background: #fff; font-family: inherit;
    }
    .textarea { min-height: 70px; resize: vertical; margin-top: 8px; }
    .btn {
      border: 0; border-radius: 16px; background: var(--primary); color: #fff; padding: 12px 16px;
      font-weight: 800; cursor: pointer;
    }
    .btn.done { background: #16a34a; }
    .btn.full { width: 100%; margin-top: 14px; }
    .progress { height: 12px; background: #e2e8f0; border-radius: 999px; overflow: hidden; margin-top: 10px; }
    .fill { height: 100%; background: var(--primary); }
    .meal-top { display: flex; justify-content: space-between; gap: 10px; }
    .badge { background: var(--soft); color: var(--primary); border-radius: 999px; padding: 8px 12px; font-size: 12px; font-weight: 700; }
    .meal-meta, .log-meta { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
    .meta-box { background: #f8fafc; border-radius: 14px; padding: 10px; color: #475569; font-size: 14px; }
    .modal {
      position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center;
      padding: 16px; z-index: 1000;
    }
    .modal-card { background: white; width: min(920px, 100%); border-radius: 24px; overflow: hidden; box-shadow: var(--shadow); }
    .modal-head { display: flex; justify-content: space-between; gap: 10px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
    .close-btn { border: 0; background: #f1f5f9; color: #334155; border-radius: 14px; padding: 10px 14px; cursor: pointer; font-weight: 700; }
    .modal-body { padding: 20px; }
    .player-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .player-box { background: #f8fafc; border-radius: 20px; padding: 16px; }
    .anim-stage { min-height: 320px; display: flex; align-items: center; justify-content: center; }
    @media (max-width: 820px) {
      h1 { font-size: 30px; }
      .player-grid { grid-template-columns: 1fr; }
      .watch-btn { min-width: 84px; }
      .day-name { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>  <script>
    const DAILY_TARGETS = { calories: 2200, protein: 150, carbs: 220, fat: 60 };
    const TRAINING_OVERVIEW = {
      weeklyStructure: [
        'الأحد: Upper A',
        'الاثنين: Lower A',
        'الثلاثاء: راحة أو مشي خفيف',
        'الأربعاء: Upper B',
        'الخميس: Lower B',
        'الجمعة: راحة',
        'السبت: راحة أو مشي خفيف'
      ],
      returnPhase: {
        durationWeeks: '2-4 أسابيع',
        workoutDuration: '45-60 دقيقة حديد + 15-20 دقيقة كارديو بعد التمرين',
        intensity: 'ابدأ بجهد متوسط واترك 2-3 عدات احتياط في أول أسبوعين'
      }
    };

    const TRAINING_DAYS = [
      {
        id: 'upper-a',
        name: 'تمارين العلوي (الأحد)',
        focus: 'صدر + ظهر + كتف جانبي + كتف خلفي',
        cardio: '15 دقيقة مشي بعد التمرين',
        notes: 'تمارين آمنة للعودة بعد الانقطاع مع تركيز على الوضعية.',
        exercises: [
          { id:'machine-chest-press', animationKey:'machine_chest_press', arabicName:'ضغط صدر جهاز', name:'Machine Chest Press', duration:'40ث', level:'مبتدئ', sets:'3', reps:'10', link:'https://youtu.be/FXZcFBBJgWg' },
          { id:'lat-pulldown', animationKey:'lat_pulldown', arabicName:'سحب علوي', name:'Lat Pulldown', duration:'40ث', level:'مبتدئ', sets:'3', reps:'10', link:'https://youtu.be/jDwfoPmHd1k' },
          { id:'seated-row', animationKey:'seated_row', arabicName:'سحب أرضي جهاز', name:'Seated Row', duration:'40ث', level:'مبتدئ', sets:'3', reps:'10', link:'https://youtu.be/d30OHGc2VcY' },
          { id:'reverse-pec-deck', animationKey:'reverse_pec_deck', arabicName:'كتف خلفي جهاز', name:'Reverse Pec Deck', duration:'30ث', level:'مهم', sets:'3', reps:'12', link:'https://youtu.be/dbALgVHdJRM' },
          { id:'cable-lateral-raise', animationKey:'cable_lateral_raise', arabicName:'كتف جانبي كيبل', name:'Cable Lateral Raise', duration:'30ث', level:'مهم', sets:'3', reps:'12-15', link:'https://youtu.be/3VcKaXpzqRo' }
        ]
      },
      {
        id: 'lower-a',
        name: 'تمارين السفلي (الاثنين)',
        focus: 'أرجل آمنة بدون ضغط كبير على الظهر',
        cardio: '15 دقيقة مشي مائل',
        notes: 'تمارين مستقرة ومناسبة لوضعك الحالي.',
        exercises: [
          { id:'leg-press', animationKey:'leg_press', arabicName:'دفع الأرجل', name:'Leg Press', duration:'40ث', level:'مبتدئ', sets:'3', reps:'12', link:'https://youtu.be/W1SD96lrudY' },
          { id:'leg-extension', animationKey:'leg_extension', arabicName:'تمديد الأرجل', name:'Leg Extension', duration:'30ث', level:'مبتدئ', sets:'3', reps:'12', link:'https://youtu.be/_2N_e-wYyeg' },
          { id:'leg-curl', animationKey:'leg_curl', arabicName:'خلف الفخذ', name:'Leg Curl', duration:'30ث', level:'مبتدئ', sets:'3', reps:'12', link:'https://youtu.be/tHV000dBZ7A' },
          { id:'goblet-squat', animationKey:'goblet_squat', arabicName:'سكوات دمبل خفيف', name:'Goblet Squat', duration:'35ث', level:'مبتدئ', sets:'2-3', reps:'10', link:'https://youtu.be/MeIiIdhvXT4' }
        ]
      },
      {
        id: 'upper-b',
        name: 'تمارين العلوي (الأربعاء)',
        focus: 'صدر علوي + ظهر + كتف جانبي + كتف خلفي',
        cardio: '15 دقيقة كارديو خفيف',
        notes: 'تنويع بسيط يخدم التضخيم ويحافظ على أمان المفاصل.',
        exercises: [
          { id:'incline-press', animationKey:'incline_press', arabicName:'ضغط مائل', name:'Incline Press', duration:'40ث', level:'مبتدئ', sets:'3', reps:'10', link:'https://youtu.be/2caIbxcYQSU' },
          { id:'one-arm-row', animationKey:'seated_row', arabicName:'سحب دمبل', name:'One Arm Row', duration:'40ث', level:'مبتدئ', sets:'3', reps:'10', link:'https://youtu.be/tpV2NDgxG1c' },
          { id:'reverse-pec-deck-b', animationKey:'reverse_pec_deck', arabicName:'كتف خلفي جهاز', name:'Reverse Pec Deck', duration:'30ث', level:'مهم', sets:'3', reps:'12', link:'https://youtu.be/dbALgVHdJRM' },
          { id:'cable-lateral-raise-b', animationKey:'cable_lateral_raise', arabicName:'كتف جانبي كيبل', name:'Cable Lateral Raise', duration:'30ث', level:'مهم', sets:'3', reps:'12-15', link:'https://youtu.be/3VcKaXpzqRo' }
        ]
      },
      {
        id: 'lower-b',
        name: 'تمارين السفلي (الخميس)',
        focus: 'تقوية الأرجل والخلفية بشكل آمن',
        cardio: '15 دقيقة مشي',
        notes: 'نسخة سفلي ثانية آمنة بدون RDL أو Hip Thrust.',
        exercises: [
          { id:'leg-press-b', animationKey:'leg_press', arabicName:'دفع الأرجل', name:'Leg Press', duration:'40ث', level:'مبتدئ', sets:'3', reps:'12', link:'https://youtu.be/W1SD96lrudY' },
          { id:'leg-curl-b', animationKey:'leg_curl', arabicName:'خلف الفخذ', name:'Leg Curl', duration:'30ث', level:'مبتدئ', sets:'3', reps:'12', link:'https://youtu.be/tHV000dBZ7A' },
          { id:'leg-extension-b', animationKey:'leg_extension', arabicName:'تمديد الأرجل', name:'Leg Extension', duration:'30ث', level:'مبتدئ', sets:'2-3', reps:'12', link:'https://youtu.be/_2N_e-wYyeg' },
          { id:'goblet-squat-b', animationKey:'goblet_squat', arabicName:'سكوات دمبل خفيف', name:'Goblet Squat', duration:'35ث', level:'مبتدئ', sets:'2', reps:'10', link:'https://youtu.be/MeIiIdhvXT4' }
        ]
      }
    ];

    const DEFAULT_MEALS = [
      { id:'breakfast-eggs-oats', name:'بيض + شوفان', category:'فطور', calories:420, protein:28, carbs:32, fat:18 },
      { id:'greek-yogurt-honey-fruit', name:'زبادي يوناني + عسل + فاكهة', category:'فطور', calories:310, protein:20, carbs:35, fat:8 },
      { id:'chicken-rice', name:'دجاج + رز', category:'غداء', calories:540, protein:42, carbs:52, fat:14 },
      { id:'beef-potato', name:'لحم + بطاطس', category:'غداء', calories:610, protein:40, carbs:48, fat:24 },
      { id:'fish-rice', name:'سمك + رز', category:'غداء', calories:470, protein:38, carbs:45, fat:11 },
      { id:'tuna-salad', name:'تونة + سلطة', category:'عشاء', calories:290, protein:32, carbs:8, fat:12 },
      { id:'light-chicken-salad', name:'دجاج خفيف + سلطة', category:'عشاء', calories:340, protein:35, carbs:12, fat:15 },
      { id:'banana-snack', name:'موزة', category:'سناك', calories:105, protein:1, carbs:27, fat:0 },
      { id:'whey-shake', name:'بروتين شيك', category:'سناك', calories:130, protein:24, carbs:3, fat:2 }
    ];

    const state = {
      tab: 'dashboard',
      meals: [],
      intake: null,
      modalExercise: null,
      todayWorkout: null,
      trainingLog: {},
      weeklySummary: { completedSessions: 0, cardioMinutes: 0, painAlerts: 0 },
      smartCoach: { message: 'ابدأ اليوم بهدوء وركّز على الأداء النظيف.', status: 'ready' }
    };

    function todayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function dayName() {
      return ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][new Date().getDay()];
    }
    function getTodayWorkout() {
      const map = { 'الأحد':'upper-a','الاثنين':'lower-a','الثلاثاء':null,'الأربعاء':'upper-b','الخميس':'lower-b','الجمعة':null,'السبت':null };
      return TRAINING_DAYS.find(d => d.id === map[dayName()]) || null;
    }
    function yt(url) {
      try {
        const u = new URL(url);
        if (u.hostname.includes('youtube.com')) {
          const v = u.searchParams.get('v');
          if (v) return `https://www.youtube-nocookie.com/embed/${v}`;
        }
        if (u.hostname.includes('youtu.be')) {
          return `https://www.youtube-nocookie.com/embed/${u.pathname.replace('/','').trim()}`;
        }
      } catch (e) {}
      return '';
    }
    function groupedMeals(meals) {
      const groups = { 'فطور': [], 'غداء': [], 'عشاء': [], 'سناك': [] };
      meals.forEach(m => { if (!groups[m.category]) groups[m.category] = []; groups[m.category].push(m); });
      return groups;
    }
    function storageKey(name) { return `captain_yasser_${name}`; }
    function loadData() {
      state.meals = JSON.parse(localStorage.getItem(storageKey('meals')) || 'null') || DEFAULT_MEALS;
      state.intake = JSON.parse(localStorage.getItem(storageKey('intake_' + todayKey())) || 'null') || { calories:0, protein:0, carbs:0, fat:0, meals:[] };
      state.trainingLog = JSON.parse(localStorage.getItem(storageKey('log_' + todayKey())) || '{}');
      state.weeklySummary = JSON.parse(localStorage.getItem(storageKey('summary_' + todayKey())) || 'null') || { completedSessions:0, cardioMinutes:0, painAlerts:0 };
      state.smartCoach = JSON.parse(localStorage.getItem(storageKey('coach_' + todayKey())) || 'null') || { message:'ابدأ اليوم بهدوء وركّز على الأداء النظيف.', status:'ready' };
      state.todayWorkout = getTodayWorkout();
    }
    function saveIntake() { localStorage.setItem(storageKey('intake_' + todayKey()), JSON.stringify(state.intake)); }
    function saveLog() {
      localStorage.setItem(storageKey('log_' + todayKey()), JSON.stringify(state.trainingLog));
      localStorage.setItem(storageKey('summary_' + todayKey()), JSON.stringify(state.weeklySummary));
      localStorage.setItem(storageKey('coach_' + todayKey()), JSON.stringify(state.smartCoach));
    }
    function refreshSummary() {
      const entries = Object.values(state.trainingLog || {});
      state.weeklySummary.completedSessions = entries.filter(x => x.completed).length;
      state.weeklySummary.painAlerts = entries.filter(x => Number(x.pain || 0) >= 6).length;
    }
    function evalCoach() {
      const entries = Object.values(state.trainingLog || {});
      const done = entries.filter(x => x.completed).length;
      const avgPain = entries.length ? entries.reduce((s, x) => s + Number(x.pain || 0), 0) / entries.length : 0;
      const cardio = state.weeklySummary.cardioMinutes || 0;
      if (avgPain >= 6) {
        state.smartCoach = { status:'warning', message:'مستوى الألم مرتفع اليوم. خفف الشدة وركز على التحكم.' };
        return;
      }
      if (done >= 3 && cardio >= 15) {
        state.smartCoach = { status:'great', message:'أداء ممتاز. إذا كانت آخر مجموعة مريحة، زد الوزن زيادة بسيطة جدًا في الحصة القادمة.' };
        return;
      }
      if (done === 0) {
        state.smartCoach = { status:'ready', message:'ابدأ اليوم بأول تمرين فقط ثم قيّم طاقتك. الأهم الآن الاستمرارية لا المثالية.' };
        return;
      }
      state.smartCoach = { status:'good', message:'أنت ماشي بشكل جيد. كمّل بهدوء، وخلك مركز على التكنيك أكثر من الوزن.' };
    }
    function suggestion() {
      const p = Math.max(0, DAILY_TARGETS.protein - (state.intake.protein || 0));
      const c = Math.max(0, DAILY_TARGETS.carbs - (state.intake.carbs || 0));
      const f = Math.max(0, DAILY_TARGETS.fat - (state.intake.fat || 0));
      if (p >= c && p >= f) return [...state.meals].filter(m => m.protein >= 20).sort((a,b) => b.protein - a.protein)[0];
      if (c >= p && c >= f) return [...state.meals].filter(m => m.carbs >= 20).sort((a,b) => b.carbs - a.carbs)[0];
      return [...state.meals].filter(m => m.fat >= 10).sort((a,b) => b.fat - a.fat)[0];
    }
    function addMeal(id) {
      const meal = state.meals.find(m => m.id === id);
      if (!meal) return;
      state.intake.calories += meal.calories;
      state.intake.protein += meal.protein;
      state.intake.carbs += meal.carbs;
      state.intake.fat += meal.fat;
      state.intake.meals.push({ ...meal, addedAt: new Date().toISOString() });
      saveIntake();
      render();
    }
    function toggleDone(id) {
      const current = state.trainingLog[id] || { completed:false, weight:'', repsDone:'', pain:0, notes:'' };
      state.trainingLog[id] = { ...current, completed: !current.completed };
      refreshSummary();
      evalCoach();
      saveLog();
      render();
    }
    function updateField(id, field, value) {
      const current = state.trainingLog[id] || { completed:false, weight:'', repsDone:'', pain:0, notes:'' };
      state.trainingLog[id] = { ...current, [field]: value };
      refreshSummary();
      evalCoach();
      saveLog();
    }
    function updateCardio(value) {
      state.weeklySummary.cardioMinutes = Number(value || 0);
      evalCoach();
      saveLog();
      render();
    }

    function coachBadge() {
      const map = {
        ready: ['#ecfeff', '#0f766e', 'جاهز'],
        good: ['#eff6ff', '#1d4ed8', 'جيد'],
        great: ['#ecfccb', '#3f6212', 'ممتاز'],
        warning: ['#fef2f2', '#b91c1c', 'تنبيه']
      };
      const s = map[state.smartCoach.status] || map.ready;
      return `<div style="background:${s[0]};color:${s[1]};padding:8px 12px;border-radius:999px;font-size:12px;font-weight:800;display:inline-block">${s[2]}</div>`;
    }

    function benchSVG(title, incline, top) {
      return `
      <svg viewBox="0 0 360 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <rect width="100%" height="100%" rx="26" fill="#0b0b0f"/>
        <text x="180" y="28" text-anchor="middle" fill="#fff" font-size="16" font-family="Tahoma" font-weight="700">${title}</text>
        <g transform="translate(${incline ? 115 : 108} ${incline ? 234 : 226}) rotate(${incline ? -28 : 0})">
          <rect x="0" y="0" width="${incline ? 138 : 148}" height="18" rx="9" fill="#7c8496"/>
          <rect x="10" y="10" width="12" height="80" rx="6" fill="#4e5668"/>
          <rect x="126" y="10" width="12" height="80" rx="6" fill="#4e5668"/>
        </g>
        <g transform="translate(182 212) rotate(${incline ? -28 : -88})">
          <ellipse cx="0" cy="-82" rx="20" ry="24" fill="#d9d9dd" stroke="#23232b" stroke-width="2"/>
          <path d="M-38,-48 Q0,-66 38,-48 L28,28 Q0,48 -28,28 Z" fill="#d9d9dd" stroke="#23232b" stroke-width="2"/>
          <path d="M-34,-42 Q-8,-55 0,-18 Q-16,-4 -30,-12 Z" fill="#ff6b4a"/>
          <path d="M34,-42 Q8,-55 0,-18 Q16,-4 30,-12 Z" fill="#ff6b4a"/>
          <ellipse cx="-33" cy="-36" rx="15" ry="14" fill="#ff6b4a"/>
          <ellipse cx="33" cy="-36" rx="15" ry="14" fill="#ff6b4a"/>
          <g transform="translate(-33 -30) rotate(${top ? -78 : -25})"><rect x="-8" y="0" width="16" height="46" rx="8" fill="#d9d9dd"/><rect x="-7" y="44" width="14" height="46" rx="7" fill="#7aa7ff"/></g>
          <g transform="translate(33 -30) rotate(${top ? 78 : 25})"><rect x="-8" y="0" width="16" height="46" rx="8" fill="#d9d9dd"/><rect x="-7" y="44" width="14" height="46" rx="7" fill="#7aa7ff"/></g>
        </g>
      </svg>`;
    }
    function pullSVG(title, bottom) {

    }
    function rowSVG(title, pull) {

      <svg viewBox="0 0 360 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <rect width="100%" height="100%" rx="26" fill="#0b0b0f"/>
        <text x="180" y="28" text-anchor="middle" fill="#fff" font-size="16" font-family="Tahoma" font-weight="700">${title}</text>
        <rect x="62" y="214" width="220" height="12" rx="6" fill="#4e5668"/>
        <rect x="70" y="160" width="18" height="64" rx="8" fill="#7c8496"/>
        <rect x="82" y="152" width="54" height="12" rx="6" fill="#7c8496"/>
        <line x1="266" y1="72" x2="${handleX}" y2="146" stroke="#d9dee6" stroke-width="4"/>
        <path d="M${handleX-10} 146 h20" stroke="#d9dee6" stroke-width="5" stroke-linecap="round"/>
        <g transform="translate(162 196) rotate(${pull ? 6 : 16})">
          <ellipse cx="0" cy="-82" rx="20" ry="24" fill="#d9d9dd"/><path d="M-38,-48 Q0,-66 38,-48 L28,28 Q0,48 -28,28 Z" fill="#d9d9dd"/>
          <path d="M-28,-18 Q-46,4 -34,24 Q-18,12 -14,-8 Z" fill="#ff6b4a"/><path d="M28,-18 Q46,4 34,24 Q18,12 14,-8 Z" fill="#ff6b4a"/>
          <g transform="translate(-33 -30) rotate(${pull ? -10 : -52})"><rect x="-8" y="0" width="16" height="46" rx="8" fill="#7aa7ff"/><rect x="-7" y="44" width="14" height="46" rx="7" fill="#d9d9dd"/></g>
          <g transform="translate(33 -30) rotate(${pull ? 10 : 52})"><rect x="-8" y="0" width="16" height="46" rx="8" fill="#7aa7ff"/><rect x="-7" y="44" width="14" height="46" rx="7" fill="#d9d9dd"/></g>
        </g>
      </svg>`;
    }
    function lateralSVG(title, top) {
      return `
      <svg viewBox="0 0 360 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <rect width="100%" height="100%" rx="26" fill="#0b0b0f"/>
        <text x="180" y="28" text-anchor="middle" fill="#fff" font-size="16" font-family="Tahoma" font-weight="700">${title}</text>
        <g transform="translate(180 214)">
          <ellipse cx="0" cy="-82" rx="20" ry="24" fill="#d9d9dd"/><path d="M-38,-48 Q0,-66 38,-48 L28,28 Q0,48 -28,28 Z" fill="#d9d9dd"/>
          <ellipse cx="-33" cy="-36" rx="15" ry="14" fill="#ff6b4a"/><ellipse cx="33" cy="-36" rx="15" ry="14" fill="#ff6b4a"/>
          <g transform="translate(-33 -30) rotate(${top ? -88 : -18})"><rect x="-8" y="0" width="16" height="46" rx="8" fill="#d9d9dd"/><rect x="-7" y="44" width="14" height="46" rx="7" fill="#d9d9dd"/></g>
          <g transform="translate(33 -30) rotate(${top ? 88 : 18})"><rect x="-8" y="0" width="16" height="46" rx="8" fill="#d9d9dd"/><rect x="-7" y="44" width="14" height="46" rx="7" fill="#d9d9dd"/></g>
        </g>
      </svg>`;
    }
    function lowerSVG(title, mode) {
      if (mode === 'press') return `
        <svg viewBox="0 0 360 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" rx="26" fill="#0b0b0f"/><text x="180" y="28" text-anchor="middle" fill="#fff" font-size="16" font-family="Tahoma" font-weight="700">${title}</text><line x1="78" y1="250" x2="220" y2="108" stroke="#4e5668" stroke-width="12"/><g transform="translate(168 222) rotate(-42)"><ellipse cx="0" cy="-82" rx="20" ry="24" fill="#d9d9dd"/><path d="M-38,-48 Q0,-66 38,-48 L28,28 Q0,48 -28,28 Z" fill="#d9d9dd"/><g transform="translate(-16 28) rotate(-60)"><rect x="-9" y="0" width="18" height="52" rx="9" fill="#ff6b4a"/><rect x="-8" y="50" width="16" height="52" rx="8" fill="#7aa7ff"/></g><g transform="translate(16 28) rotate(-60)"><rect x="-9" y="0" width="18" height="52" rx="9" fill="#ff6b4a"/><rect x="-8" y="50" width="16" height="52" rx="8" fill="#7aa7ff"/></g></g></svg>`;
      if (mode === 'extension') return `
        <svg viewBox="0 0 360 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" rx="26" fill="#0b0b0f"/><text x="180" y="28" text-anchor="middle" fill="#fff" font-size="16" font-family="Tahoma" font-weight="700">${title}</text><g transform="translate(180 206)"><ellipse cx="0" cy="-82" rx="20" ry="24" fill="#d9d9dd"/><path d="M-38,-48 Q0,-66 38,-48 L28,28 Q0,48 -28,28 Z" fill="#d9d9dd"/><g transform="translate(-16 28) rotate(-88)"><rect x="-9" y="0" width="18" height="52" rx="9" fill="#ff6b4a"/></g><g transform="translate(16 28) rotate(-88)"><rect x="-9" y="0" width="18" height="52" rx="9" fill="#ff6b4a"/></g></g></svg>`;
      if (mode === 'curl') return `
        <svg viewBox="0 0 360 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" rx="26" fill="#0b0b0f"/><text x="180" y="28" text-anchor="middle" fill="#fff" font-size="16" font-family="Tahoma" font-weight="700">${title}</text><g transform="translate(178 188) rotate(-88)"><ellipse cx="0" cy="-82" rx="20" ry="24" fill="#d9d9dd"/><path d="M-38,-48 Q0,-66 38,-48 L28,28 Q0,48 -28,28 Z" fill="#d9d9dd"/><g transform="translate(-16 28) rotate(52)"><rect x="-8" y="50" width="16" height="52" rx="8" fill="#7aa7ff"/></g><g transform="translate(16 28) rotate(-52)"><rect x="-8" y="50" width="16" height="52" rx="8" fill="#7aa7ff"/></g></g></svg>`;
      return `
        <svg viewBox="0 0 360 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" rx="26" fill="#0b0b0f"/><text x="180" y="28" text-anchor="middle" fill="#fff" font-size="16" font-family="Tahoma" font-weight="700">${title}</text><g transform="translate(180 206)"><ellipse cx="0" cy="-82" rx="20" ry="24" fill="#d9d9dd"/><path d="M-38,-48 Q0,-66 38,-48 L28,28 Q0,48 -28,28 Z" fill="#d9d9dd"/><g transform="translate(-16 28) rotate(48)"><rect x="-9" y="0" width="18" height="52" rx="9" fill="#ff6b4a"/><rect x="-8" y="50" width="16" height="52" rx="8" fill="#7aa7ff"/></g><g transform="translate(16 28) rotate(-48)"><rect x="-9" y="0" width="18" height="52" rx="9" fill="#ff6b4a"/><rect x="-8" y="50" width="16" height="52" rx="8" fill="#7aa7ff"/></g></g></svg>`;
    }
    const ANIMS = {
      machine_chest_press: [() => benchSVG('ضغط صدر جهاز', false, false), () => benchSVG('ضغط صدر جهاز', false, true)],
      incline_press: [() => benchSVG('ضغط مائل', true, false), () => benchSVG('ضغط مائل', true, true)],
      lat_pulldown: [() => pullSVG('سحب علوي', false), () => pullSVG('سحب علوي', true)],
      seated_row: [() => rowSVG('سحب أرضي جهاز', false), () => rowSVG('سحب أرضي جهاز', true)],
      reverse_pec_deck: [() => lateralSVG('كتف خلفي جهاز', false), () => lateralSVG('كتف خلفي جهاز', true)],
      cable_lateral_raise: [() => lateralSVG('كتف جانبي كيبل', false), () => lateralSVG('كتف جانبي كيبل', true)],
      leg_press: [() => lowerSVG('دفع الأرجل', 'press')],
      leg_extension: [() => lowerSVG('تمديد الأرجل', 'extension')],
      leg_curl: [() => lowerSVG('خلف الفخذ', 'curl')],
      goblet_squat: [() => lowerSVG('سكوات دمبل خفيف', 'goblet')]
    };
    let animTimer = null;
    function mountAnimation(target, key) {
      if (!target || !ANIMS[key]) return;
      let i = 0;
      target.innerHTML = ANIMS[key][0]();
      clearInterval(animTimer);
      animTimer = setInterval(() => {
        i = (i + 1) % ANIMS[key].length;
        target.innerHTML = ANIMS[key][i]();
      }, 700);
    }

    function percent(value, total) { return Math.min(100, Math.round((value / total) * 100)); }
    function setTab(tab) { state.tab = tab; render(); }
    function openExercise(id) {
      state.modalExercise = TRAINING_DAYS.flatMap(d => d.exercises).find(x => x.id === id) || null;
      render();
      const stage = document.getElementById('anim-stage');
      if (state.modalExercise && stage) mountAnimation(stage, state.modalExercise.animationKey);
    }
    function closeModal() { state.modalExercise = null; clearInterval(animTimer); render(); }

    function tabs() {
      return `<div class="tabs">
        <button class="tab-btn ${state.tab==='dashboard'?'active':''}" onclick="window.__appSetTab('dashboard')">الرئيسية</button>
        <button class="tab-btn ${state.tab==='training'?'active':''}" onclick="window.__appSetTab('training')">النظام التدريبي</button>
        <button class="tab-btn ${state.tab==='meals'?'active':''}" onclick="window.__appSetTab('meals')">الوجبات والمتابعة</button>
      </div>`;
    }

    function hero() {
      return `<div class="card hero">
        <div class="hero-badge">نسخة مصححة تعمل بدون Firebase</div>
        <h1>كابتن ياسر<span>Upper / Lower Split</span></h1>
        <p class="muted">هذه النسخة تعمل كاملة من دون أخطاء Firebase، وتحفظ بياناتك محليًا داخل المتصفح.</p>
        <div class="grid grid-4">
          <div class="card metric"><div class="muted">أيام الحديد</div><div class="metric-value">4</div></div>
          <div class="card metric"><div class="muted">الكارديو</div><div class="metric-value">15-20</div></div>
          <div class="card metric"><div class="muted">التهيئة</div><div class="metric-value">2-4</div></div>
          <div class="card metric"><div class="muted">الحفظ</div><div class="metric-value">محلي</div></div>
        </div>
      </div>`;
    }

    function dashboard() {
      const total = TRAINING_DAYS.reduce((s,d) => s + d.exercises.length, 0);
      const suggestionMeal = suggestion();
      return `${hero()}
      <div class="card section">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
          <div><h2 class="title">المدرب الذكي</h2><p class="subtitle">توصية اليوم بناءً على تقدمك الفعلي</p></div>
          ${coachBadge()}
        </div>
        <div class="list-item" style="background:#fff7ed;color:#7c2d12">${state.smartCoach.message}</div>
      </div>
      <div class="grid grid-2">
        <div class="card section"><h2 class="title">تمرين اليوم التلقائي</h2><p class="subtitle">يظهر لك تلقائيًا حسب اليوم</p>${state.todayWorkout ? `<div class="list-item"><strong>${state.todayWorkout.name}</strong><br><span class="muted">${state.todayWorkout.focus}</span></div><button class="btn full" onclick="window.__appSetTab('training')">افتح تمرين اليوم</button>` : `<div class="list-item">اليوم مخصص للراحة أو المشي الخفيف.</div>`}</div>
        <div class="card section"><h2 class="title">ملخصك اليومي</h2><p class="subtitle">متابعة ذكية وسريعة</p><div class="list"><div class="list-item">التمارين المنجزة: ${state.weeklySummary.completedSessions}</div><div class="list-item">دقائق الكارديو: ${state.weeklySummary.cardioMinutes}</div><div class="list-item">تنبيهات الألم: ${state.weeklySummary.painAlerts}</div></div></div>
      </div>
      <div class="grid grid-2">
        <div class="card section"><h2 class="title">توزيع الأسبوع</h2><p class="subtitle">الخطة الحالية</p><div class="list">${TRAINING_OVERVIEW.weeklyStructure.map(i => `<div class="list-item">${i}</div>`).join('')}</div></div>
        <div class="card section"><h2 class="title">ملاحظات البداية</h2><p class="subtitle">أول أسابيع الرجوع</p><div class="list"><div class="list-item">المدة: ${TRAINING_OVERVIEW.returnPhase.durationWeeks}</div><div class="list-item">زمن الجلسة: ${TRAINING_OVERVIEW.returnPhase.workoutDuration}</div><div class="list-item">الشدة: ${TRAINING_OVERVIEW.returnPhase.intensity}</div></div></div>
      </div>
      ${suggestionMeal ? `<div class="card section"><h2 class="title">اقتراح وجبة</h2><p class="subtitle">بحسب النقص الحالي في يومك</p><div class="list-item"><strong>${suggestionMeal.name}</strong> — ${suggestionMeal.calories} سعرة</div></div>` : ''}
      <div class="grid grid-4">
        <div class="card metric"><div class="muted">عدد الأيام التدريبية</div><div class="metric-value">${TRAINING_DAYS.length}</div></div>
        <div class="card metric"><div class="muted">عدد التمارين</div><div class="metric-value">${total}</div></div>
        <div class="card metric"><div class="muted">هدف السعرات</div><div class="metric-value">${DAILY_TARGETS.calories}</div></div>
        <div class="card metric"><div class="muted">هدف البروتين</div><div class="metric-value">${DAILY_TARGETS.protein} جم</div></div>
      </div>`;
    }

    function trainingControls(ex) {
      const l = state.trainingLog[ex.id] || { completed:false, weight:'', repsDone:'', pain:0, notes:'' };
      return `<div class="inputs">
        <input class="field" value="${l.weight || ''}" oninput="window.__updateExerciseField('${ex.id}','weight',this.value)" placeholder="الوزن" />
        <input class="field" value="${l.repsDone || ''}" oninput="window.__updateExerciseField('${ex.id}','repsDone',this.value)" placeholder="العدات الفعلية" />
        <input class="field" value="${l.pain || ''}" oninput="window.__updateExerciseField('${ex.id}','pain',this.value)" placeholder="مستوى الألم 0-10" />
      </div>
      <textarea class="textarea" oninput="window.__updateExerciseField('${ex.id}','notes',this.value)" placeholder="ملاحظات سريعة">${l.notes || ''}</textarea><button class="btn ${l.completed ? 'done' : ''}" style="margin-top:10px" onclick="window.__toggleExerciseDone('${ex.id}')">${l.completed ? 'تم الإنجاز ✓' : 'تسجيل الإنجاز'}</button>`;
}

function training() {
  return `<div class="card section">
    <h2 class="title">النظام التدريبي</h2>
    <p class="subtitle">كل تمرين فيه فيديو + أنيميشن + تسجيل وزن وعدات وألم.</p>
    <div class="grid grid-4">
      <div class="list-item">التمارين المنجزة: ${state.weeklySummary.completedSessions}</div>
      <div class="list-item">تنبيهات الألم: ${state.weeklySummary.painAlerts}</div>
      <div class="list-item">تمرين اليوم: ${state.todayWorkout ? state.todayWorkout.name : 'راحة'}</div>
      <div class="list-item">دقائق الكارديو <input class="field" value="${state.weeklySummary.cardioMinutes || ''}" oninput="window.__updateCardioMinutes(this.value)" placeholder="مثلاً 15" style="margin-top:8px" /></div>
    </div>
  </div>
  ${TRAINING_DAYS.map(day => `<div class="card day-card"><div class="day-head"><div><h3 class="day-name">${day.name}</h3><div class="day-focus">${day.focus}</div></div><div class="pill">${day.cardio}</div></div><div class="day-notes">${day.notes}</div><div class="exercise-list">${day.exercises.map((ex, i) => { const l = state.trainingLog[ex.id] || {}; return `<div class="exercise-card"><div class="exercise-row"><button class="watch-btn" onclick="window.__openExercise('${ex.id}')">شاهد</button><div class="exercise-content"><div class="exercise-title">${i+1}. ${ex.arabicName} <span>(${ex.name})</span></div><div class="chips"><div class="chip">${ex.duration}</div><div class="chip">${ex.level}</div><div class="chip">${ex.sets} مجموعات</div><div class="chip">${ex.reps}</div>${l.completed ? '<div class="chip done-chip">منجز</div>' : ''}</div>${trainingControls(ex)}</div></div></div>`; }).join('')}</div></div>`).join('')}`;
}

function progressCard(label, value, target, unit) {
  return `<div class="card section"><div style="display:flex;justify-content:space-between;gap:10px"><div class="muted">${label}</div><div style="font-weight:700">${value} / ${target} ${unit}</div></div><div class="progress"><div class="fill" style="width:${percent(value, target)}%"></div></div></div>`;
}

function meals() {
  const g = groupedMeals(state.meals);
  return `<div class="card section"><h2 class="title">الوجبات والمتابعة</h2><p class="subtitle">هذه النسخة تحفظ أكلك محليًا داخل المتصفح بدون Firebase.</p></div>
  <div class="grid grid-4">
    ${progressCard('السعرات', state.intake.calories || 0, DAILY_TARGETS.calories, 'سعرة')}
    ${progressCard('البروتين', state.intake.protein || 0, DAILY_TARGETS.protein, 'جم')}
    ${progressCard('الكربوهيدرات', state.intake.carbs || 0, DAILY_TARGETS.carbs, 'جم')}
    ${progressCard('الدهون', state.intake.fat || 0, DAILY_TARGETS.fat, 'جم')}
  </div>
  ${Object.entries(g).map(([cat, items]) => `<div class="card section"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2 class="title">${cat}</h2><p class="subtitle">وجبات جاهزة</p></div><div class="badge">${items.length} وجبة</div></div><div class="grid grid-2">${items.map(meal => `<div class="card meal-card"><div class="meal-top"><div><h3 style="margin:0">${meal.name}</h3><div class="muted">${meal.category}</div></div><div class="badge">${meal.calories} سعرة</div></div><div class="meal-meta"><div class="meta-box">بروتين: ${meal.protein}</div><div class="meta-box">كارب: ${meal.carbs}</div><div class="meta-box">دهون: ${meal.fat}</div><div class="meta-box">${meal.category}</div></div><button class="btn full" onclick="window.__addMeal('${meal.id}')">إضافة لليوم</button></div>`).join('')}</div></div>`).join('')}
  <div class="card section"><h2 class="title">الوجبات المضافة اليوم</h2><p class="subtitle">سجل اليوم الحالي</p>${!state.intake.meals.length ? '<p class="muted">لم يتم إضافة أي وجبة اليوم بعد.</p>' : `<div class="list">${state.intake.meals.map(m => `<div class="card section"><div style="display:flex;justify-content:space-between;gap:10px"><div><h4 style="margin:0">${m.name}</h4><div class="muted">${m.category}</div></div><div class="muted">${m.calories} سعرة</div></div><div class="log-meta"><div class="meta-box">بروتين ${m.protein}</div><div class="meta-box">كارب ${m.carbs}</div><div class="meta-box">دهون ${m.fat}</div><div class="meta-box">تمت الإضافة</div></div></div>`).join('')}</div>`}</div>`;
}

function modal() {
  if (!state.modalExercise) return '';
  const embed = yt(state.modalExercise.link);
  return `<div class="modal" onclick="window.__closeModal(event)"><div class="modal-card" onclick="event.stopPropagation()"><div class="modal-head"><div><div style="font-size:22px;font-weight:800">${state.modalExercise.arabicName}</div><div class="muted">${state.modalExercise.name}</div></div><button class="close-btn" onclick="window.__hideModal()">إغلاق</button></div><div class="modal-body"><div class="player-grid"><div class="player-box"><div style="font-size:18px;font-weight:800;margin-bottom:10px">الأنيميشن الذكي</div><div id="anim-stage" class="anim-stage"></div></div><div class="player-box"><div style="font-size:18px;font-weight:800;margin-bottom:10px">الفيديو التعليمي</div>${embed ? `<div style="position:relative;padding-top:56.25%;border-radius:18px;overflow:hidden;background:#e2e8f0"><iframe src="${embed}" title="${state.modalExercise.arabicName}" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>` : '<p class="muted">تعذر تضمين الفيديو.</p>'}<div class="chips" style="margin-top:12px"><div class="chip">${state.modalExercise.duration}</div><div class="chip">${state.modalExercise.level}</div><div class="chip">${state.modalExercise.sets} مجموعات</div><div class="chip">${state.modalExercise.reps}</div></div></div></div></div></div></div>`;
}

function render() {
  const app = document.getElementById('app');
  let content = '';
  if (state.tab === 'dashboard') content = dashboard();
  if (state.tab === 'training') content = training();
  if (state.tab === 'meals') content = meals();
  app.innerHTML = `<div class="app">${tabs()}${content}${modal()}</div>`;
  if (state.modalExercise) {
    const stage = document.getElementById('anim-stage');
    if (stage) mountAnimation(stage, state.modalExercise.animationKey);
  }
}

window.__appSetTab = setTab;
window.__addMeal = addMeal;
window.__toggleExerciseDone = toggleDone;
window.__updateExerciseField = updateField;
window.__updateCardioMinutes = updateCardio;
window.__openExercise = openExercise;
window.__hideModal = closeModal;
window.__closeModal = function(e) { if (e.target.classList.contains('modal')) closeModal(); };

loadData();
refreshSummary();
evalCoach();
render();

  </script>
</body>
