<!DOCTYPE html>
<html>
<head>
  <title>Captain Yasser App</title>
</head>
<body>

  <h1>🚀 Captain Yasser App</h1>

  <h2 id="name">Loading...</h2>
  <p id="level"></p>
  <p id="xp"></p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA9C9uiDeN6Ikvvo3chDQ9RHz58zik5mw4",
      authDomain: "captain-yasser-pro.firebaseapp.com",
      projectId: "captain-yasser-pro",
      storageBucket: "captain-yasser-pro.firebasestorage.app",
      messagingSenderId: "1025929025248",
      appId: "1:1025929025248:web:86bb9469f4a5cd90356285"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadData() {
      const querySnapshot = await getDocs(collection(db, "users"));

      querySnapshot.forEach((doc) => {
        const data = doc.data();

        document.getElementById("name").innerText = data.name;
        document.getElementById("level").innerText = "Level: " + data.level;
        document.getElementById("xp").innerText = "XP: " + data.xp;
      });
    }

    loadData();
  </script>

</body>
</html>
