<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Captain Yasser</title><style>
body {
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
}

.container{
  padding:20px;
}

.card{
  background:#1e293b;
  padding:15px;
  border-radius:15px;
  margin-bottom:15px;
}

button{
  padding:10px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
}
</style></head><body>
<div class="container">
<h2>🔥 كابتن ياسر - المدرب الذكي</h2><div id="status" class="card">جاري التحميل...</div><div class="card">
<h3>🏋️‍♂️ تمرين اليوم</h3>
<ul id="workout"></ul>
</div><button onclick="saveData()">💾 حفظ التقدم</button>

</div><!-- Firebase FIX --><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ⚠️ ضع بياناتك هنا
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_BUCKET",
  messagingSenderId: "YOUR_MSG_ID",
  appId: "YOUR_APP_ID"
};

let db;

try {
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  document.getElementById("status").innerText = "✅ Firebase متصل";
} catch (e) {
  document.getElementById("status").innerText = "❌ Firebase غير مفعل - التطبيق يعمل بدون حفظ";
}

// تمارينك المعدلة
const exercises = [
"Incline Chest Press",
"Lat Pulldown",
"Flat Chest Press",
"Seated Row",
"Lateral Raise",
"Biceps Curl",
"Triceps Pushdown"
];

const list = document.getElementById("workout");
exercises.forEach(ex => {
  const li = document.createElement("li");
  li.innerText = ex;
  list.appendChild(li);
});

// حفظ البيانات
window.saveData = async function(){
  if(!db){
    alert("⚠️ Firebase غير مفعل");
    return;
  }

  await setDoc(doc(db, "users", "yasser"), {
    lastWorkout: new Date().toISOString()
  });

  alert("✅ تم الحفظ");
}
</script></body>
</html>
