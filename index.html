<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Captain Yasser App</title>
</head>

<body style="font-family: Arial; text-align:center; padding:50px;">

  <h1>🚀 Captain Yasser App</h1>
  <p id="status">جاري الاتصال بالسحابة...</p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA9C9uiDeN6Ikvvo3chDQ9RHz58zik5mw4",
      authDomain: "captain-yasser-pro.firebaseapp.com",
      projectId: "captain-yasser-pro",
      storageBucket: "captain-yasser-pro.firebasestorage.app",
      messagingSenderId: "1025929025248",
      appId: "1:1025929025248:web:86bb9469f4a5cd90356285"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    async function start() {
      try {
        const result = await signInAnonymously(auth);
        const uid = result.user.uid;

        const ref = doc(db, "users", uid);

        await setDoc(ref, {
          name: "Captain Yasser",
          time: Date.now()
        });

        document.getElementById("status").innerText =
          "✅ تم الاتصال بالسحابة بنجاح";
        
        console.log("🔥 Firebase connected:", uid);

      } catch (error) {
        document.getElementById("status").innerText =
          "❌ فشل الاتصال";
        console.error(error);
      }
    }

    start();
  </script>

</body>
</html>
